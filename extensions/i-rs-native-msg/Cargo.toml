[package]
name = "i-rs-native-msg"
version = "0.1.0"
edition = "2021"
authors = ["i-rs"]
description = "Native Messaging host for i-rs Chrome Extension"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
