[package]
name = "i-rs-claw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI personal assistant — Web Dashboard + TUI terminal interface"

[dependencies]
i-rs-claw-core = { path = "../claw-core", features = ["mcp", "tui", "dashboard"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
reqwest.workspace = true
ratatui = "0.30"
crossterm = "0.29"
ratatui-interact = "0.5"
futures-util = "0.3"
dirs.workspace = true
toml.workspace = true
uuid.workspace = true
clap.workspace = true
unicode-width = "0.2"
owo-colors.workspace = true
pulldown-cmark.workspace = true
async-trait.workspace = true
base64.workspace = true
subtle = "2"
fastrand = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
mime_guess = { version = "2", optional = true }

[features]
default = []
dashboard = ["axum", "tower-http", "rust-embed", "mime_guess", "i-rs-claw-core/dashboard"]
sqlite = ["i-rs-claw-core/sqlite"]
mysql  = ["i-rs-claw-core/mysql"]
postgres = ["i-rs-claw-core/postgres"]
mongo = ["i-rs-claw-core/mongo"]
redis = ["i-rs-claw-core/redis"]

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http = "1"
