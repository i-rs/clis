[package]
name = "i-rs-claw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TUI intelligent personal data assistant powered by i-rs CLI tools"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
reqwest.workspace = true
rmcp = { version = "1.7.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
ratatui = "0.30"
crossterm = "0.29"
futures-util = "0.3"
dirs.workspace = true
toml.workspace = true
uuid.workspace = true
clap.workspace = true
unicode-width = "0.2"
owo-colors.workspace = true
pulldown-cmark.workspace = true
async-trait.workspace = true
base64.workspace = true
fastrand = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
mime_guess = { version = "2", optional = true }

[features]
default = []
dashboard = ["axum", "tower-http", "rust-embed", "mime_guess"]

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http = "1"
