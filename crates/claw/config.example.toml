# ============================================================================
# i-rs-claw 配置文件
# 路径: ~/.i-rs-claw/config.toml
# 格式: TOML
# ============================================================================

# ── LLM Provider ────────────────────────────────────────────────────────────
#
# provider:  "openai" | "anthropic" | "ollama"
#            兼容 OpenAI API 的第三方服务（如 DeepSeek、Groq、OpenRouter）也设为 "openai"
provider = "openai"

# api_key:  API 密钥
#           也可以通过环境变量 I_RS_CLAW_API_KEY 设置，优先级高于文件
api_key = "your-api-key"

# base_url: API 端点地址
base_url = "https://api.deepseek.com"

# model:    模型名称
model = "deepseek-v4-flash"


# ── 工具管理 ────────────────────────────────────────────────────────────────
#
# enabled_tools:  启用的工具列表。留空 = 全部启用
#                 如需限制工具范围，取消注释并编辑以下列表
# enabled_tools = ["kv", "weight", "water", "sleep", "meal", "pig", "mood", "sit", "spark", "todo"]


# ── 搜索引擎 ────────────────────────────────────────────────────────────────
#
# search_api_key:   专用搜索 API 密钥（例如 SerpAPI、Google Custom Search）
#                   不设置则回退到 DuckDuckGo（免费，无需密钥）
# search_base_url:  自定义搜索 API 端点地址
# search_api_key = "your-search-api-key"
# search_base_url = "https://custom-search-api.example.com"


# ── 文件操作权限 ────────────────────────────────────────────────────────────
#
# allowed_dirs:  允许工具读写/列目录的路径。留空表示禁止文件操作
# allowed_dirs = ["~/Documents", "~/Downloads"]


# ── MCP 服务器 ──────────────────────────────────────────────────────────────
#
# mcp_servers:  外部 MCP 工具服务器列表
#               enabled: 是否启用（默认 true），设为 false 可临时禁用
#
# [[mcp_servers]]
# name = "filesystem"
# transport_type = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/workspace"]
# env = ["NODE_PATH=/usr/local/lib/node_modules"]
# enabled = true

# [[mcp_servers]]
# name = "github"
# transport_type = "sse"
# url = "https://mcp-github.example.com/sse"
# enabled = true


# ── 插件发现 ────────────────────────────────────────────────────────────────
#
# plugins_auto_discover:  自动发现 ~/.i-rs-claw/plugins/ 下的插件
#                         插件以 "plugin:xxx" 名称注册到 MCP 列表
plugins_auto_discover = true
# disabled_plugins:  要禁用的插件列表（保留安装但禁止加载）
#                    也可以通过 `i-rs-claw plugin enable/disable` 管理
# disabled_plugins = ["hello-mcp", "calculator-mcp"]


# ── 执行模式 ────────────────────────────────────────────────────────────────
#
# execution_mode:  "React" (默认) | "PlanThenExecute" (实验性)
execution_mode = "React"


# ── 引擎调优参数 ──────────────────────────────────────────────────────────
#
# max_react_rounds:         单次对话最大 ReAct 循环轮数 (默认: 20)
#                           当 LLM 持续调用工具时，达到此上限后停止
# max_tool_retries:         单次工具调用最大重试次数 (默认: 2)
#                           工具执行出错后的自动重试次数
# cli_timeout_secs:         CLI 子命令执行超时秒数 (默认: 30)
#                           超过此时间未完成的 CLI 调用将被终止
# max_conversation_turns:   上下文保留的最近对话轮数 (默认: 8)
#                           超出部分将被裁剪以控制 token 消耗
# max_react_rounds = 20
# max_tool_retries = 2
# cli_timeout_secs = 30
# max_conversation_turns = 8


# ── Gateway（社交平台接入）──────────────────────────────────────────────────
#
# [gateway]
# enabled = false
#
#   [gateway.telegram]
#   enabled = false
#   token = "YOUR_BOT_TOKEN"
#   agent_id = "default"
#
#   # 微信个人号 — 无需静态 token/URL，首次运行二维码登录
#   [gateway.wechat]
#   enabled = false
#   agent_id = "default"


# ── Dashboard（Web 管理界面）───────────────────────────────────────────────
#
# [dashboard]
# enabled = false
# host = "127.0.0.1"
# port = 3000
# auth_token = "your-secret-token"    # Bearer token 认证。未设置时自动生成随机 UUID


# ── Agent 配置 ──────────────────────────────────────────────────────────────
#
# 默认智能体 "default" 始终存在，不可创建/删除/修改。
# 它使用顶层的 provider/model/api_key/base_url 配置。
# 以下 [agents.*] 仅用于添加额外的智能体，每个 agent 可覆盖
# provider/model/tools/system_prompt，未设字段继承顶层配置。
#
# [agents.analyst]
# model = "gpt-4o"
# tools = ["kv", "weight", "sleep", "mood", "exercise"]
# system_prompt = "你是一名数据分析师…"
# capabilities = ["数据分析", "趋势预测"]
#
# [agents.writer]
# provider = "anthropic"
# model = "claude-sonnet-4-20250514"
# tools = ["note", "snippet", "vocab", "bookmark", "quote"]
# system_prompt_file = "agents/writer_prompt.md"     # 相对 ~/.i-rs-claw/ 的路径
# capabilities = ["内容创作"]


# ── Sub-agent（仅用于 delegate_task，TUI 不可见）────────────────────────────
#
# [sub_agents.coder]
# model = "gpt-4o"
# enabled_tools = ["kv", "todo", "note", "remind", "project", "snippet"]
# system_prompt = "你是一名编程助手…"
# capabilities = ["代码审查", "脚本编写"]


# ── Token 用量统计 ──────────────────────────────────────────────────────────
#
# [stats]
# enabled = true                                   # 是否启用统计（默认 true）
# keep_days = 90                                   # 保留天数（0 = 永久保留）
#
#   # 自定义模型定价 (USD / 1M tokens)
#   # 内置支持: gpt-4o-mini, gpt-4o, claude-sonnet-4, claude-haiku-4,
#   #           deepseek-chat, deepseek-reasoner 等常见模型
#   # 未列出的模型按模糊前缀匹配，不匹配则按 $0 计费
#   #
#   [stats.pricing]
#   # "my-custom-model" = { input = 1.0, output = 3.0 }
#   # "gpt-4o" = { input = 2.0, output = 8.0 }
