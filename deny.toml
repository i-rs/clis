[advisories]
ignore = [
    "RUSTSEC-2024-0320",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0141",
    # 以下均为 unmaintained 告警（非漏洞），来自 tauri 的 Linux 依赖树
    # (gtk3 / unic / proc-macro-error)，上游无替代前暂无法规避
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0098",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    # target-lexicon (tauri/wasm 依赖)
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
