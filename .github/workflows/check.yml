name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  test-code-agent:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (i-rs-code)
        run: cargo test -p i-rs-code -- --test-threads=1
      - name: cargo clippy (i-rs-code)
        run: cargo clippy -p i-rs-code -- -D warnings
      - name: cargo fmt (i-rs-code)
        run: cargo fmt -p i-rs-code --check

  test-core-claw-api:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (i-rs-core)
        run: cargo test -p i-rs-core
      - name: cargo test (i-rs-claw)
        run: cargo test -p i-rs-claw -- --test-threads=1
      - name: cargo test (i-rs-api)
        run: cargo test -p i-rs-api

  claw-features:
    strategy:
      matrix:
        features:
          - dashboard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (i-rs-claw --features ${{ matrix.features }})
        run: cargo check -p i-rs-claw --features ${{ matrix.features }}
